<html>
    <body>
        <center>
        <h1>Nome:</h1>
        <input type="text" name="nome" id="nome" placeholder="Digite seu nome">
        <h1>Endereço:</h1>
        <input type="text" name="endereco" id="endereco" placeholder="Digite seu endereço">
        <br/><br/>
        <h1>Ano de Nascimento:</h1>
        <input type="number" name="ano_nascimento" id="ano_nascimento" placeholder="Digite seu ano de nascimento">
        <br/><br/>
        <button onclick="alert('Olá...' + ' ' + nome.value + ' ' + endereco.value + ' ' + (2026 - ano_nascimento.value) + ' anos')">Salvar</button>  
        </center>
    </body>
</html>
